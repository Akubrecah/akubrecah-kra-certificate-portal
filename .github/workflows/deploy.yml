name: Production Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  production-deploy:
    name: 🚀 Production Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_vmAKoPs7Zz3mGe6LEUj5WiIs' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_qP2jRgwrMsICqRlBPqMsvdkcRyRe' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Validate Prisma Schema & Generate Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
        run: |
          npm run prisma:validate
          npx prisma generate

      - name: 🔍 ESLint Analysis
        run: npm run lint -- --quiet

      - name: 🏷️ TypeScript Typecheck
        run: npm run typecheck

      - name: 🏗️ Production Build Verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/postgres?schema=public' }}
          NEXT_PUBLIC_APP_URL: https://kra-certificate.vercel.app
          NEXT_PUBLIC_SUPER_ADMIN_EMAIL: poweldayck@gmail.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder_for_ci' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder_for_ci' }}
        run: npm run build

      - name: 📦 Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel Production Environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Production Artifacts with Vercel
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Vercel Production
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          PROD_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"

      - name: 📢 Dispatch Production Deployment Alert
        if: always()
        env:
          EVOLUTION_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          ADMIN_PHONE: ${{ secrets.ADMIN_WHATSAPP_PHONE || '254791497858' }}
          WEBHOOK_URL: ${{ secrets.WHATSAPP_NOTIFICATION_WEBHOOK }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          STATUS="SUCCESS 🚀"
          if [ "$BUILD_STATUS" != "success" ]; then
            STATUS="FAILED ❌"
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | head -c 80)
          MESSAGE="🚀 *Akubrecah KRA Production Release Alert*\n\n"
          MESSAGE+="• Status: ${STATUS}\n"
          MESSAGE+="• Branch: main\n"
          MESSAGE+="• Commit: ${{ github.sha }}\n"
          MESSAGE+="• Note: ${COMMIT_MSG}\n"
          MESSAGE+="• Author: ${{ github.actor }}\n"
          MESSAGE+="• Live URL: https://kra-certificate.vercel.app\n\n"
          MESSAGE+="Action Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # 1. Custom Webhook
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Sending release notification to webhook..."
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\", \"status\":\"$STATUS\", \"repo\":\"${{ github.repository }}\"}" || true
          fi

          # 2. WhatsApp Notification via Evolution API
          if [ -n "$EVOLUTION_URL" ] && [ -n "$EVOLUTION_KEY" ]; then
            echo "Sending WhatsApp notification via Evolution API..."
            CLEAN_PHONE=$(echo "$ADMIN_PHONE" | tr -cd '0-9')
            curl -s -X POST "${EVOLUTION_URL}/message/sendText/akubrecah-kra" \
              -H "apikey: ${EVOLUTION_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"number\":\"${CLEAN_PHONE}\",\"text\":\"${MESSAGE}\"}" || true
          fi

          echo "Deployment alert dispatched."
